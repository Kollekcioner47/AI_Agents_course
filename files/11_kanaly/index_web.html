<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Ася — веб-чат</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 640px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        #log {
            border: 1px solid #ccc;
            border-radius: 4px;
            height: 20rem;
            overflow-y: auto;
            padding: .5rem;
            margin-bottom: .5rem;
        }
        .user {
            text-align: right;
            color: #06c;
            margin: .3rem 0;
        }
        .bot {
            text-align: left;
            color: #333;
            margin: .3rem 0;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: .5rem;
            margin: .3rem 0;
        }
        button {
            padding: .5rem 1rem;
        }
    </style>
</head>
<body>
    <h1>Ася</h1>
    <div id="log"></div>
    <input id="password" type="password" placeholder="Пароль">
    <input id="message" type="text" placeholder="Ваш вопрос...">
    <button id="send">Отправить</button>

    <script>
        const log = document.getElementById("log");
        const password = document.getElementById("password");
        const message = document.getElementById("message");
        const send = document.getElementById("send");

        function addLine(text, cls) {
            const div = document.createElement("div");
            div.className = cls;
            div.textContent = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        async function ask() {
            const text = message.value.trim();
            if (!text) return;
            addLine(text, "user");
            message.value = "";
            try {
                const resp = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text, password: password.value }),
                });
                const data = await resp.json();
                addLine(data.answer || "Нет ответа", "bot");
            } catch (err) {
                addLine("Ошибка: " + err, "bot");
            }
        }

        send.addEventListener("click", ask);
        message.addEventListener("keydown", (e) => {
            if (e.key === "Enter") ask();
        });
    </script>
</body>
</html>
